<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Shopping Copilot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>AI Shopping Copilot</h1>
      <p>Upgrade to Pro for advanced features.</p>
    </header>

    <section id="subscribe">
      <h2>Subscribe</h2>

      <label for="email">Email (optional)</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
        <button id="subscribe-monthly" class="btn primary">
          Subscribe Monthly — $7 / month
        </button>

        <button id="subscribe-yearly" class="btn secondary">
          Subscribe Yearly — $49 / year
        </button>
      </div>

      <p style="margin-top:12px; color:#666; font-size:13px;">
        You will be redirected to Stripe to complete payment. After payment you will be returned here to finish activation.
      </p>
    </section>
  </main>

  <!-- Keep any existing scripts here, then add the checkout helper at the end -->
  <script>
    // Replace with your backend URL if different
    const BACKEND_URL = "https://backend-z2eg.onrender.com";

    // Your Stripe price IDs
    const PRICE_MONTHLY = "price_1TuK7yGiVKUf3MRAyGVQbfDO";
    const PRICE_YEARLY  = "price_1TuKALGiVKUf3MRADPm52LXm";

    async function startCheckout(priceId) {
      try {
        const emailEl = document.getElementById("email");
        const email = emailEl ? (emailEl.value || null) : null;

        const res = await fetch(`${BACKEND_URL}/api/create-checkout-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ priceId, email })
        });

        const data = await res.json();
        if (data?.url) {
          // Use location.href to ensure GitHub Pages allows the redirect
          window.location.href = data.url;
        } else {
          console.error("Checkout failed:", data);
          alert("Failed to start checkout: " + (data?.error || "unknown error"));
        }
      } catch (err) {
        console.error("Checkout error:", err);
        alert("Checkout error: " + (err.message || err));
      }
    }

    // Wire buttons after DOM is ready
    document.addEventListener("DOMContentLoaded", () => {
      const btnMonthly = document.getElementById("subscribe-monthly");
      const btnYearly  = document.getElementById("subscribe-yearly");

      if (btnMonthly) btnMonthly.addEventListener("click", () => startCheckout(PRICE_MONTHLY));
      if (btnYearly)  btnYearly.addEventListener("click",  () => startCheckout(PRICE_YEARLY));
    });
  </script>
</body>
</html>
