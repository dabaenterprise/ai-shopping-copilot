<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Shopping Copilot</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#C8A24B;--white:#f6f7fb}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#0b1220 0%, #0f1724 100%);color:var(--white)}
    main{max-width:920px;margin:48px auto;padding:28px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;box-shadow:0 10px 40px rgba(2,6,23,0.6)}
    header h1{margin:0;font-size:28px;letter-spacing:-0.4px}
    header p{margin:6px 0 18px;color:var(--muted)}
    #subscribe{display:block;padding:18px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03)}
    label{display:block;margin-bottom:8px;color:var(--muted);font-size:13px}
    input[type="email"]{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.25);color:var(--white);font-size:14px}
    .btn{padding:12px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .primary{background:linear-gradient(90deg,var(--accent),#e4c878);color:#111}
    .secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--white)}
    .row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
    .note{margin-top:12px;color:var(--muted);font-size:13px}
    .status{margin-top:14px;padding:10px;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--muted);font-size:13px;border:1px dashed rgba(255,255,255,0.03)}
    footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
    @media (max-width:520px){main{margin:20px;padding:18px}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Shopping Copilot</h1>
      <p>Upgrade to Pro for advanced features.</p>
    </header>

    <section id="subscribe">
      <h2 style="margin:0 0 12px 0;font-size:18px">Subscribe</h2>

      <label for="email">Email (optional)</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <div class="row">
        <button id="subscribe-monthly" class="btn primary">
          Subscribe Monthly — $7 / month
        </button>

        <button id="subscribe-yearly" class="btn secondary">
          Subscribe Yearly — $49 / year
        </button>
      </div>

      <p class="note">
        You will be redirected to Stripe to complete payment. After payment you will be returned here to finish activation.
      </p>

      <div id="status" class="status" aria-live="polite">Status: idle</div>
    </section>

    <footer>Questions? Contact <a href="mailto:privacy@aishoppingcopilot.com" style="color:var(--accent);text-decoration:none">privacy@aishoppingcopilot.com</a></footer>
  </main>

  <script>
    // ====== CONFIG ======
    const BACKEND_URL = "https://backend-z2eg.onrender.com"; // keep this exact
    const PRICE_MONTHLY = "price_1TuKALGiVKUf3MRADPm52LXm";
    const PRICE_YEARLY  = "price_1TuK7yGiVKUf3MRAyGVQbfDO";

    // ====== helper to update UI status ======
    function setStatus(text, isError = false) {
      const el = document.getElementById("status");
      el.textContent = "Status: " + text;
      el.style.color = isError ? "#ffb4b4" : "";
    }

    // ====== Checkout starter ======
    async function startCheckout(priceId) {
      try {
        console.log("[checkout] start", priceId);
        setStatus("starting checkout…");

        const emailEl = document.getElementById("email");
        const email = emailEl ? (emailEl.value || null) : null;

        const res = await fetch(`${BACKEND_URL}/api/create-checkout-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ priceId, email })
        });

        const data = await res.json();
        console.log("[checkout] response", data);

        if (data?.url) {
          setStatus("redirecting to Stripe…");
          // open in same tab so Stripe can redirect back to this page
          window.location.href = data.url;
        } else {
          setStatus("failed to start checkout: " + (data?.error || "unknown"), true);
          console.error("Checkout failed:", data);
          alert("Failed to start checkout: " + (data?.error || "unknown error"));
        }
      } catch (err) {
        console.error("Checkout error:", err);
        setStatus("checkout error: " + (err.message || err), true);
        alert("Checkout error: " + (err.message || err));
      }
    }

    // ====== Wire buttons after DOM ready ======
    document.addEventListener("DOMContentLoaded", () => {
      console.log("index.html loaded");
      setStatus("ready");

      const btnMonthly = document.getElementById("subscribe-monthly");
      const btnYearly  = document.getElementById("subscribe-yearly");

      if (btnMonthly) btnMonthly.addEventListener("click", () => startCheckout(PRICE_MONTHLY));
      if (btnYearly)  btnYearly.addEventListener("click",  () => startCheckout(PRICE_YEARLY));
    });
  </script>
</body>
</html>
